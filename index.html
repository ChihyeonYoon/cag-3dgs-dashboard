<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCA CAG 3DGS Research Dashboard</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Highlight.js for Code Highlighting -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
  
  <!-- KaTeX for math formula rendering -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  
  <!-- Custom Styling -->
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-cyan: #00f2fe;
      --accent-blue: #4facfe;
      --accent-gradient: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      --sidebar-width: 280px;
      --toc-width: 250px;
      
      /* Carousel styles - Theme Aware */
      --carousel-bg: rgba(0, 0, 0, 0.2);
      --carousel-caption-bg: rgba(17, 24, 39, 0.85);
      --carousel-btn-bg: rgba(17, 24, 39, 0.7);
      --carousel-btn-color: #f8fafc;
      --carousel-dot-bg: rgba(255, 255, 255, 0.2);
    }

    body.light-mode {
      --bg-color: #f1f5f9;
      --card-bg: rgba(255, 255, 255, 0.85);
      --card-border: rgba(0, 0, 0, 0.08);
      --text-main: #0f172a;
      --text-muted: #475569;
      --accent-cyan: #0284c7;
      --accent-blue: #0369a1;
      --accent-gradient: linear-gradient(135deg, #0369a1 0%, #0284c7 100%);
      
      /* Carousel styles - Light Mode overrides */
      --carousel-bg: rgba(0, 0, 0, 0.03);
      --carousel-caption-bg: rgba(255, 255, 255, 0.9);
      --carousel-btn-bg: rgba(255, 255, 255, 0.8);
      --carousel-btn-color: #0f172a;
      --carousel-dot-bg: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Sidebar Styles */
    .sidebar {
      width: var(--sidebar-width);
      background-color: rgba(15, 23, 42, 0.95);
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      padding: 24px;
    }

    body.light-mode .sidebar {
      background-color: #e2e8f0;
    }

    .logo-container {
      margin-bottom: 40px;
    }

    .logo-container h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .logo-container p {
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .nav-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 16px;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 12px;
      border: 1px solid transparent;
    }

    .nav-item:hover {
      background-color: rgba(255, 255, 255, 0.03);
      color: var(--text-main);
    }

    body.light-mode .nav-item:hover {
      background-color: rgba(0, 0, 0, 0.03);
    }

    .nav-item.active {
      background-color: rgba(0, 242, 254, 0.1);
      color: var(--text-main);
      border-color: rgba(0, 242, 254, 0.2);
      box-shadow: 0 4px 20px rgba(0, 242, 254, 0.05);
    }

    /* Main Container Styles */
    .main-container {
      margin-left: var(--sidebar-width);
      margin-right: var(--toc-width);
      flex: 1;
      padding: 40px 60px;
      min-width: 0; /* Prevents overflow inside flex child */
    }

    /* Header Panel */
    .header-panel {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px 32px;
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    }

    .header-info h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .header-info p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .controls {
      display: flex;
      gap: 12px;
    }

    .btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.2);
    }

    /* Content Area Styles */
    .content-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 48px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
      line-height: 1.7;
    }

    /* Markdown Styling (Prism-like Custom Styles) */
    .markdown-body h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .markdown-body h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 40px;
      margin-bottom: 16px;
      color: var(--text-main);
      border-left: 4px solid var(--accent-cyan);
      padding-left: 12px;
    }

    .markdown-body h3 {
      font-family: 'Outfit', sans-serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 32px;
      margin-bottom: 12px;
      color: var(--text-main);
    }

    .markdown-body p {
      margin-bottom: 20px;
      color: var(--text-main);
      font-size: 1.05rem;
    }

    .markdown-body ul, .markdown-body ol {
      margin-bottom: 24px;
      padding-left: 24px;
    }

    .markdown-body li {
      margin-bottom: 8px;
      font-size: 1.05rem;
    }

    /* Tables */
    .markdown-body table {
      width: 100%;
      border-collapse: collapse;
      margin: 32px 0;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    .markdown-body th {
      background-color: rgba(255, 255, 255, 0.04);
      font-weight: 600;
      padding: 14px 18px;
      text-align: left;
      font-size: 0.95rem;
      border-bottom: 2px solid var(--card-border);
    }

    body.light-mode .markdown-body th {
      background-color: rgba(0, 0, 0, 0.04);
    }

    .markdown-body td {
      padding: 14px 18px;
      font-size: 0.95rem;
      border-bottom: 1px solid var(--card-border);
    }

    .markdown-body tr:hover {
      background-color: rgba(255, 255, 255, 0.01);
    }

    /* Code & Blocks */
    .markdown-body code {
      font-family: 'Fira Code', monospace;
      background-color: rgba(255, 255, 255, 0.06);
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #ff7b72;
    }

    body.light-mode .markdown-body code {
      background-color: rgba(0, 0, 0, 0.06);
      color: #cf222e;
    }

    .markdown-body pre {
      background-color: #0d1117 !important;
      padding: 24px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 24px 0;
      border: 1px solid var(--card-border);
    }

    .markdown-body pre code {
      background-color: transparent;
      padding: 0;
      color: #c9d1d9;
      font-size: 0.9rem;
    }

    /* GFM Alert blocks */
    .markdown-body blockquote {
      border-left: 4px solid var(--text-muted);
      padding: 16px 24px;
      background-color: rgba(255, 255, 255, 0.02);
      border-radius: 0 8px 8px 0;
      margin: 24px 0;
    }

    .markdown-body blockquote p {
      margin-bottom: 0;
      font-size: 1rem;
      color: var(--text-muted);
    }

    /* Custom styles for GFM Alert categories */
    .markdown-body blockquote.alert-note {
      border-left-color: #38bdf8;
      background-color: rgba(56, 189, 248, 0.05);
    }
    .markdown-body blockquote.alert-note strong {
      color: #38bdf8;
    }

    .markdown-body blockquote.alert-warning {
      border-left-color: #fb923c;
      background-color: rgba(251, 146, 60, 0.05);
    }
    .markdown-body blockquote.alert-warning strong {
      color: #fb923c;
    }

    .markdown-body blockquote.alert-important {
      border-left-color: #a855f7;
      background-color: rgba(168, 85, 247, 0.05);
    }
    .markdown-body blockquote.alert-important strong {
      color: #a855f7;
    }

    /* Images */
    .markdown-body img {
      max-width: 100%;
      height: auto;
      border-radius: 12px;
      margin: 32px 0;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      border: 1px solid var(--card-border);
      display: block;
    }

    /* Table of Contents (TOC) Sidebar on the Right */
    .toc-container {
      width: var(--toc-width);
      height: 100vh;
      position: fixed;
      right: 0;
      top: 0;
      background-color: rgba(15, 23, 42, 0.95);
      border-left: 1px solid var(--card-border);
      z-index: 100;
      padding: 40px 24px;
      overflow-y: auto;
    }

    body.light-mode .toc-container {
      background-color: #e2e8f0;
    }

    .toc-title {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .toc-item a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      transition: all 0.2s ease;
      display: block;
      line-height: 1.4;
    }

    .toc-item.h2-item {
      padding-left: 0;
      font-weight: 600;
    }

    .toc-item.h3-item {
      padding-left: 16px;
      font-size: 0.8rem;
    }

    .toc-item a:hover, .toc-item.active a {
      color: var(--accent-cyan);
    }

    /* Interactive Carousel Styles */
    .carousel-container {
      position: relative;
      margin: 40px 0;
      background: var(--carousel-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      overflow: hidden;
      padding-bottom: 24px;
    }

    .carousel-slides {
      position: relative;
      width: 100%;
      height: auto;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .carousel-slide {
      display: none;
      width: 100%;
      animation: fade 0.5s ease;
      position: relative;
    }

    .carousel-slide.active {
      display: block;
    }

    .carousel-slide img {
      max-height: 520px;
      width: 100%;
      object-fit: contain;
      border: none;
      box-shadow: none;
      margin: 0;
      border-radius: 0;
    }

    .carousel-caption {
      text-align: center;
      font-size: 0.95rem;
      color: var(--text-main);
      padding: 16px;
      background: var(--carousel-caption-bg);
      font-weight: 500;
      border-top: 1px solid var(--card-border);
    }

    .carousel-btn {
      position: absolute;
      top: 40%;
      transform: translateY(-50%);
      background: var(--carousel-btn-bg);
      color: var(--carousel-btn-color);
      border: 1px solid var(--card-border);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 1.2rem;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.2s ease;
      z-index: 10;
    }

    .carousel-btn:hover {
      background: var(--accent-gradient);
      color: white;
      border-color: transparent;
      box-shadow: 0 0 10px rgba(0, 242, 254, 0.3);
    }

    .carousel-btn.prev {
      left: 20px;
    }

    .carousel-btn.next {
      right: 20px;
    }

    .carousel-dots {
      text-align: center;
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .carousel-dot {
      height: 10px;
      width: 10px;
      background-color: var(--carousel-dot-bg);
      border-radius: 50%;
      display: inline-block;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .carousel-dot.active, .carousel-dot:hover {
      background-color: var(--accent-cyan);
      transform: scale(1.25);
    }

    @keyframes fade {
      from {opacity: .4} 
      to {opacity: 1}
    }

    /* Error Message Overlay (CORS Policy Help) */
    .error-overlay {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      padding: 30px;
      margin: 40px 0;
      color: #fca5a5;
    }

    .error-overlay h3 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      font-weight: 700;
    }

    .error-overlay code {
      display: block;
      background: rgba(0,0,0,0.3);
      padding: 12px;
      border-radius: 6px;
      margin: 16px 0;
      font-family: 'Fira Code', monospace;
      color: #f8fafc;
    }

    /* Loading state */
    .loading-spinner {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 300px;
      color: var(--text-muted);
      font-weight: 500;
      gap: 16px;
    }

    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border-left-color: var(--accent-cyan);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Alert Title styling */
    .alert-title {
      font-size: 0.95rem;
      margin-bottom: 8px;
    }

    /* Responsive Design */
    @media (max-width: 1200px) {
      :root {
        --toc-width: 0px;
      }
      .toc-container {
        display: none;
      }
      .main-container {
        margin-right: 0;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }
      .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        border-right: none;
        border-bottom: 1px solid var(--card-border);
        padding: 16px;
      }
      .logo-container {
        margin-bottom: 16px;
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      .logo-container p {
        margin-top: 0;
      }
      .nav-title {
        display: none;
      }
      .nav-menu {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 8px;
        gap: 12px;
        -webkit-overflow-scrolling: touch;
      }
      .nav-item {
        white-space: nowrap;
        padding: 8px 12px;
      }
      .main-container {
        margin-left: 0;
        padding: 20px;
      }
      .header-panel {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
        padding: 16px 20px;
      }
      .controls {
        width: 100%;
      }
      .btn {
        width: 100%;
        justify-content: center;
      }
      .content-card {
        padding: 24px;
      }
    }

    /* Image Zoom Modal Overlay */
    .image-modal {
      display: none;
      position: fixed;
      z-index: 3000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.82);
      backdrop-filter: blur(10px);
      cursor: zoom-out;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    
    .image-modal.show {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 1;
    }
    
    .image-modal-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 85%;
      max-height: 85vh;
      cursor: default;
    }

    .image-modal-content {
      display: block;
      max-width: 100%;
      max-height: 75vh;
      border-radius: 12px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
      transform: scale(0.9);
      transition: transform 0.2s ease, opacity 0.2s ease;
      cursor: default;
    }
    
    .image-modal.show .image-modal-content {
      transform: scale(1);
    }
    
    .close-modal {
      position: absolute;
      top: 20px;
      right: 35px;
      color: #f1f1f1;
      font-size: 40px;
      font-weight: bold;
      transition: 0.3s;
      cursor: pointer;
      z-index: 3200;
    }
    
    .close-modal:hover,
    .close-modal:focus {
      color: #bbb;
      text-decoration: none;
    }

    /* Modal slide navigation arrows */
    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background-color: rgba(255, 255, 255, 0.08);
      color: #f1f1f1;
      border: none;
      font-size: 32px;
      width: 64px;
      height: 64px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      border-radius: 50%;
      user-select: none;
      transition: background-color 0.3s, transform 0.2s, color 0.3s;
      z-index: 3100;
    }
    
    .modal-nav:hover {
      background-color: rgba(255, 255, 255, 0.25);
      color: #ffffff;
      transform: translateY(-50%) scale(1.1);
    }

    .modal-nav:active {
      transform: translateY(-50%) scale(0.95);
    }
    
    .prev-modal-btn {
      left: 40px;
    }
    
    .next-modal-btn {
      right: 40px;
    }
    
    .image-modal-caption {
      margin-top: 15px;
      text-align: center;
      color: #ddd;
      font-size: 1.15rem;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 3100;
    }

    /* Zoom cursor for clickable images */
    .markdown-body img {
      cursor: zoom-in;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    .markdown-body img:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.15);
    }
    
    body.light-mode .markdown-body img:hover {
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }
    
    body.light-mode .image-modal {
      background-color: rgba(255, 255, 255, 0.85);
    }
    
    body.light-mode .close-modal,
    body.light-mode .modal-nav {
      color: #333;
    }
    
    body.light-mode .modal-nav {
      background-color: rgba(0, 0, 0, 0.05);
    }
    
    body.light-mode .modal-nav:hover {
      background-color: rgba(0, 0, 0, 0.15);
      color: #000;
    }
    
    body.light-mode .image-modal-caption {
      color: #333;
      background: rgba(255, 255, 255, 0.8);
      border: 1px solid rgba(0, 0, 0, 0.1);
    }
  </style>
</head>
<body class="light-mode">

  <!-- Sidebar Navigation -->
  <aside class="sidebar">
    <div class="logo-container">
      <h1>LCA CAG 3DGS</h1>
      <p>Research Dashboard</p>
    </div>
    
    <nav>
      <h3 class="nav-title">연구 자료 목록</h3>
      <ul class="nav-menu">
        <li class="nav-item active" onclick="loadDoc('overview.md', this)">
          🏠 전체 연구 개요 (Overview)
        </li>
        <li class="nav-item" onclick="loadDoc('exploratory_phase_report.md', this)">
          📑 초기 탐색 단계 보고서
        </li>
        <li class="nav-item" onclick="loadDoc('main_phase_report.md', this)">
          🚀 메인 단계 보고서
        </li>
        <li class="nav-item" onclick="loadDoc('walkthrough.md', this)">
          📝 1차 결과 워크스루
        </li>
        <li class="nav-item" onclick="loadDoc('walkthrough2.md', this)">
          🔬 2차 결과 워크스루
        </li>
        <li class="nav-item" onclick="loadDoc('overall_roadmap.md', this)">
          🗺️ 전체 연구 로드맵
        </li>
      </ul>
    </nav>
  </aside>

  <!-- Main Content Area -->
  <main class="main-container">
    <div class="header-panel">
      <div class="header-info">
        <h2 id="doc-title">초기 탐색 단계 보고서</h2>
        <p id="doc-filename">File: exploratory_phase_report.md</p>
      </div>
      <div class="controls">
        <button class="btn" onclick="toggleTheme()">🌓 테마 전환</button>
      </div>
    </div>
    
    <article class="content-card">
      <div id="content" class="markdown-body">
        <!-- Markdown rendered content goes here -->
        <div class="loading-spinner">
          <div class="spinner"></div>
          <div>마크다운 파일을 불러오는 중입니다...</div>
        </div>
      </div>
    </article>
  </main>

  <!-- Right Panel Table of Contents -->
  <aside class="toc-container">
    <h3 class="toc-title">목차 (TOC)</h3>
    <ul class="toc-list" id="toc">
      <!-- Generated dynamically -->
    </ul>
  </aside>

  <!-- Script Libraries -->
  <!-- Marked for Markdown Parsing -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <!-- Highlight.js for Code Highlighting -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <!-- KaTeX for formula rendering -->
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <!-- Mermaid.js for Diagrams -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>

  <script>
    // Initialize Mermaid
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default'
    });

    let currentFile = 'overview.md';

    // Set markdown parsing options
    marked.setOptions({
      highlight: function(code, lang) {
        if (lang === 'mermaid') {
          // Do not run syntax highlighting on mermaid blocks
          return code;
        }
        if (lang && hljs.getLanguage(lang)) {
          return hljs.highlight(code, { language: lang }).value;
        }
        return hljs.highlightAuto(code).value;
      },
      breaks: true
    });

    // Theme toggle
    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const isLight = document.body.classList.contains('light-mode');
      
      // Re-init Mermaid with matching theme
      mermaid.initialize({
        startOnLoad: false,
        theme: isLight ? 'default' : 'dark'
      });
      
      // Re-render current doc to apply theme-specific graphics if needed
      renderDoc(document.getElementById('content').dataset.rawMarkdown || '');
    }

    // Custom Parser to handle custom syntax (carousels, path conversion)
    function preprocessMarkdown(markdown) {
      // 1. Process custom carousel syntax
      const carouselRegex = /```carousel([\s\S]*?)```/g;
      markdown = markdown.replace(carouselRegex, function(match, content) {
        const slides = content.trim().split(/<!-- slide -->/);
        const slidesParsed = [];
        
        slides.forEach((slide) => {
          const imgMatch = slide.match(/!\[(.*?)\]\((.*?)\)/);
          if (imgMatch) {
            slidesParsed.push({
              caption: imgMatch[1],
              url: imgMatch[2]
            });
          }
        });
        
        let slidesHtml = '';
        slidesParsed.forEach((slide, idx) => {
          slidesHtml += `<div class="carousel-slide ${idx === 0 ? 'active' : ''}"><img src="${slide.url.trim()}" alt="${slide.caption}"><div class="carousel-caption">${slide.caption}</div></div>`;
        });
        
        const carouselId = 'carousel_' + Math.random().toString(36).substr(2, 9);
        return `<div class="carousel-container" id="${carouselId}"><div class="carousel-slides">${slidesHtml}</div><button class="carousel-btn prev" onclick="moveCarousel('${carouselId}', -1)">&#10094;</button><button class="carousel-btn next" onclick="moveCarousel('${carouselId}', 1)">&#10095;</button><div class="carousel-dots">${slidesParsed.map((_, i) => `<span class="carousel-dot ${i === 0 ? 'active' : ''}" onclick="setCarousel('${carouselId}', ${i})"></span>`).join('')}</div></div>`;
      });

      // 2. Convert absolute paths to relative paths so images load correctly from local server
      markdown = markdown.replaceAll('/Users/home/.gemini/antigravity/brain/af8691ec-7f2d-4229-a6a4-e8f4635b5bd9/', './');

      return markdown;
    }

    // Load Document
    async function loadDoc(filename, element) {
      currentFile = filename;
      
      // Update nav menu active state
      if (element) {
        document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
        element.classList.add('active');
      }

      // Update header info
      const friendlyTitles = {
        'overview.md': '연구 개요 및 요약 (Overview)',
        'exploratory_phase_report.md': '초기 탐색 단계 보고서',
        'main_phase_report.md': '메인 단계 보고서',
        'walkthrough.md': '1차 결과 워크스루',
        'walkthrough2.md': '2차 결과 워크스루',
        'overall_roadmap.md': '전체 연구 로드맵'
      };
      document.getElementById('doc-title').innerText = friendlyTitles[filename] || filename;
      document.getElementById('doc-filename').innerText = `File: ${filename}`;

      // Loading state
      document.getElementById('content').innerHTML = `
        <div class="loading-spinner">
          <div class="spinner"></div>
          <div>마크다운 파일을 불러오는 중입니다...</div>
        </div>
      `;

      try {
        const response = await fetch(filename + '?t=' + Date.now());
        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }
        const text = await response.text();
        renderDoc(text);
      } catch (error) {
        console.error("Fetch failed:", error);
        showCORSWarning(filename);
      }
    }

    // Show CORS Warning Overlay
    function showCORSWarning(filename) {
      document.getElementById('content').innerHTML = `
        <div class="error-overlay">
          <h3>⚠️ 로컬 마크다운 파일 로드 불가 (CORS 정책 제한)</h3>
          <p>브라우저 보안 규칙(CORS)으로 인해, 마크다운 파일을 로컬 파일 방식(<code>file:///...</code>)으로 직접 로드할 수 없습니다.</p>
          <p>이 웹페이지가 마크다운 문서를 동적으로 렌더링하도록 하려면 아래 안내에 따라 <strong>로컬 웹 서버</strong>를 실행해 주세요.</p>
          
          <code>
# 1. 터미널을 열고 본 폴더 경로로 이동합니다.
cd /Users/home/.gemini/antigravity/brain/af8691ec-7f2d-4229-a6a4-e8f4635b5bd9/

# 2. 파이썬 기본 웹 서버를 실행합니다.
python3 serve.py
          </code>
          
          <p>서버가 시작되면 자동으로 웹브라우저에서 <code>http://localhost:8000</code> 주소로 대시보드가 열리며 모든 마크다운과 차트가 완벽하게 표시됩니다.</p>
        </div>
      `;
      document.getElementById('toc').innerHTML = '';
    }

    // Render parsed Markdown HTML
    function renderDoc(rawMarkdown) {
      const contentDiv = document.getElementById('content');
      contentDiv.dataset.rawMarkdown = rawMarkdown;

      // 1. Extract and placeholder block math
      const mathBlocks = [];
      let processed = rawMarkdown;

      // Extract block math $$ ... $$
      const blockMathRegex = /\$\$([\s\S]*?)\$\$/g;
      processed = processed.replace(blockMathRegex, (match, math) => {
        const id = `block_math_${mathBlocks.length}`;
        mathBlocks.push({ id, math, display: true });
        return `<div id="${id}"></div>`;
      });

      // Extract inline math $ ... $
      const inlineMathRegex = /\$([^\s$][^$\n]*?[^\s$]|[^\s$])\$/g;
      processed = processed.replace(inlineMathRegex, (match, math) => {
        const id = `inline_math_${mathBlocks.length}`;
        mathBlocks.push({ id, math, display: false });
        return `<span id="${id}"></span>`;
      });

      // 2. Preprocess carousels and paths
      processed = preprocessMarkdown(processed);

      // 3. Parse with marked
      const parsedHtml = marked.parse(processed);
      contentDiv.innerHTML = parsedHtml;

      // 4. Render and inject math using DOM manipulation
      mathBlocks.forEach(item => {
        const el = contentDiv.querySelector(`#${item.id}`);
        if (el) {
          try {
            katex.render(item.math, el, {
              displayMode: item.display,
              throwOnError: false
            });
          } catch (err) {
            console.error("KaTeX rendering error for ID " + item.id + ":", err);
            el.innerText = (item.display ? '$$' : '$') + item.math + (item.display ? '$$' : '$');
          }
        }
      });

      // 5. Highlight code blocks (excluding mermaid blocks)
      try {
        contentDiv.querySelectorAll('pre code:not(.language-mermaid)').forEach((block) => {
          hljs.highlightElement(block);
        });
      } catch (err) {
        console.error("Highlight.js error:", err);
      }

      // 6. Initialize Mermaid Diagrams
      try {
        const mermaidBlocks = contentDiv.querySelectorAll('pre code.language-mermaid, code.language-mermaid');
        mermaidBlocks.forEach((block, idx) => {
          const pre = block.parentElement;
          const codeText = block.textContent;
          const div = document.createElement('div');
          div.className = 'mermaid';
          div.id = `mermaid_${idx}`;
          div.textContent = codeText;
          pre.replaceWith(div);
        });
        
        if (mermaidBlocks.length > 0) {
          mermaid.run({
            querySelector: '.mermaid'
          }).catch(err => console.error("Mermaid run error:", err));
        }
      } catch (err) {
        console.error("Mermaid error:", err);
      }

      // 7. Post-process blockquotes for GFM Alerts
      try {
        contentDiv.querySelectorAll('blockquote').forEach(bq => {
          const firstP = bq.querySelector('p');
          if (!firstP) return;
          
          const text = firstP.innerHTML.trim();
          const alertMatch = text.match(/^\[!(NOTE|WARNING|IMPORTANT|TIP|CAUTION)\]/i);
          if (alertMatch) {
            const type = alertMatch[1].toUpperCase();
            firstP.innerHTML = firstP.innerHTML.replace(/^\[!(NOTE|WARNING|IMPORTANT|TIP|CAUTION)\]\s*(<br\s*\/?>)?/i, '');
            bq.className = `alert-${type.toLowerCase()}`;
            
            let title = type;
            if (type === 'NOTE') title = '📝 Note';
            else if (type === 'WARNING') title = '⚠️ Warning';
            else if (type === 'IMPORTANT') title = '💡 Important';
            else if (type === 'TIP') title = '💡 Tip';
            else if (type === 'CAUTION') title = '🔥 Caution';
            
            const titleDiv = document.createElement('div');
            titleDiv.className = 'alert-title';
            titleDiv.innerHTML = `<strong>${title}</strong>`;
            bq.insertBefore(titleDiv, bq.firstChild);
          }
        });
      } catch (err) {
        console.error("GFM Alert post-processing error:", err);
      }

      // 8. Generate Table of Contents
      generateTOC(contentDiv);

      // 9. Bind click events to all images in content for zooming
      try {
        contentDiv.querySelectorAll('img').forEach(img => {
          img.addEventListener('click', () => {
            openImageModal(img.src, img.alt);
          });
        });
      } catch (err) {
        console.error("Zoom image listener error:", err);
      }
    }

    // Generate Table of Contents dynamically
    function generateTOC(contentDiv) {
      const headers = contentDiv.querySelectorAll('h2, h3');
      const tocList = document.getElementById('toc');
      tocList.innerHTML = '';

      if (headers.length === 0) {
        tocList.innerHTML = '<li class="toc-item">표시할 목차가 없습니다.</li>';
        return;
      }

      headers.forEach((header, idx) => {
        // Create an ID if not exists
        if (!header.id) {
          header.id = 'heading_' + idx;
        }

        const li = document.createElement('li');
        li.className = `toc-item ${header.tagName.toLowerCase()}-item`;
        
        const a = document.createElement('a');
        a.href = `#${header.id}`;
        a.innerText = header.innerText;
        
        // Smooth scroll
        a.addEventListener('click', (e) => {
          e.preventDefault();
          header.scrollIntoView({ behavior: 'smooth' });
        });

        li.appendChild(a);
        tocList.appendChild(li);
      });
    }

    // Carousel interactive controls
    window.carouselState = {};

    window.moveCarousel = function(carouselId, direction) {
      const container = document.getElementById(carouselId);
      const slides = container.querySelectorAll('.carousel-slide');
      const dots = container.querySelectorAll('.carousel-dot');
      
      let currentIndex = window.carouselState[carouselId] || 0;
      slides[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');
      
      currentIndex = (currentIndex + direction + slides.length) % slides.length;
      window.carouselState[carouselId] = currentIndex;
      
      slides[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    };

    window.setCarousel = function(carouselId, slideIndex) {
      const container = document.getElementById(carouselId);
      const slides = container.querySelectorAll('.carousel-slide');
      const dots = container.querySelectorAll('.carousel-dot');
      
      let currentIndex = window.carouselState[carouselId] || 0;
      slides[currentIndex].classList.remove('active');
      dots[currentIndex].classList.remove('active');
      
      currentIndex = slideIndex;
      window.carouselState[carouselId] = currentIndex;
      
      slides[currentIndex].classList.add('active');
      dots[currentIndex].classList.add('active');
    };

    // Image Zoom Modal Functions
    window.modalImages = [];
    window.currentModalIndex = -1;

    window.openImageModal = function(src, alt) {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const caption = document.getElementById('modal-caption');
      
      // 1. Gather all images inside content
      const imgs = Array.from(document.getElementById('content').querySelectorAll('img'));
      window.modalImages = imgs.map(img => ({ src: img.src, alt: img.alt }));
      
      // 2. Find the index of clicked image
      window.currentModalIndex = imgs.findIndex(img => img.src === src);
      if (window.currentModalIndex === -1) {
        window.modalImages = [{ src, alt }];
        window.currentModalIndex = 0;
      }
      
      // 3. Update modal view
      window.updateModalView();
      
      modal.style.display = 'flex';
      // Trigger reflow
      modal.offsetHeight;
      modal.classList.add('show');
      document.body.style.overflow = 'hidden'; // Prevent scrolling background
    };
    
    window.updateModalView = function() {
      const modal = document.getElementById('image-modal');
      const modalImg = document.getElementById('modal-img');
      const caption = document.getElementById('modal-caption');
      const prevBtn = modal.querySelector('.prev-modal-btn');
      const nextBtn = modal.querySelector('.next-modal-btn');
      
      if (window.currentModalIndex < 0 || window.currentModalIndex >= window.modalImages.length) return;
      
      const currentImg = window.modalImages[window.currentModalIndex];
      modalImg.src = currentImg.src;
      caption.innerText = currentImg.alt || '';
      
      // Show/hide navigation buttons depending on image count
      if (window.modalImages.length <= 1) {
        prevBtn.style.display = 'none';
        nextBtn.style.display = 'none';
      } else {
        prevBtn.style.display = 'flex';
        nextBtn.style.display = 'flex';
      }
    };
    
    window.navigateModal = function(direction, event) {
      if (event) event.stopPropagation(); // Prevent modal close
      
      if (window.modalImages.length <= 1) return;
      
      // Move index with circular wrap-around
      window.currentModalIndex = (window.currentModalIndex + direction + window.modalImages.length) % window.modalImages.length;
      
      // Update image source and caption with a smooth transition
      const modalImg = document.getElementById('modal-img');
      modalImg.style.transform = 'scale(0.95)';
      modalImg.style.opacity = '0.5';
      
      setTimeout(() => {
        window.updateModalView();
        modalImg.style.transform = 'scale(1)';
        modalImg.style.opacity = '1';
      }, 150);
    };
    
    window.closeImageModal = function() {
      const modal = document.getElementById('image-modal');
      modal.classList.remove('show');
      setTimeout(() => {
        if (!modal.classList.contains('show')) {
          modal.style.display = 'none';
        }
      }, 300);
      document.body.style.overflow = ''; // Restore scrolling
    };

    // Keyboard navigation inside image zoom modal
    window.addEventListener('keydown', (event) => {
      const modal = document.getElementById('image-modal');
      if (!modal || modal.style.display !== 'flex') return;
      
      if (event.key === 'Escape') {
        window.closeImageModal();
      } else if (event.key === 'ArrowLeft') {
        window.navigateModal(-1);
      } else if (event.key === 'ArrowRight') {
        window.navigateModal(1);
      }
    });

    // Load initial document on page load
    window.addEventListener('DOMContentLoaded', () => {
      loadDoc('overview.md');
    });
  </script>

  <!-- Image Zoom Modal -->
  <div id="image-modal" class="image-modal" onclick="closeImageModal()">
    <span class="close-modal">&times;</span>
    <button class="modal-nav prev-modal-btn" onclick="navigateModal(-1, event)">&#10094;</button>
    <div class="image-modal-wrapper" onclick="event.stopPropagation()">
      <img class="image-modal-content" id="modal-img">
      <div id="modal-caption" class="image-modal-caption"></div>
    </div>
    <button class="modal-nav next-modal-btn" onclick="navigateModal(1, event)">&#10095;</button>
  </div>
</body>
</html>
